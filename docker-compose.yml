# Use the modern Docker Compose file format.
services:
  # Create the FastAPI app service.
  app:
    build: .
    container_name: rag-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://rag:[REDACTED]@postgres:5432/rag
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./pdfs:/app/pdfs
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  # Create one PostgreSQL service with pgvector already installed.
  postgres:
    # Use the official pgvector image built on PostgreSQL 16.
    image: pgvector/pgvector:pg16
    # Restart the database automatically unless we stop it ourselves.
    restart: unless-stopped
    # Set the initial database name, user, and password.
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: Pltl_1997
    ports:
      - "5433:5432"
    # Keep database files even when the container is recreated.
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data
    # Check that PostgreSQL is really accepting connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

# Create the named volume used above.
volumes:
  rag_postgres_data: